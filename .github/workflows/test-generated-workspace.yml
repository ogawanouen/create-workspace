name: Test generated Cloudflare workspace

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Name for the generated test workspace
        required: true
        default: cloudflare-smoke-test
        type: string

permissions:
  contents: read

jobs:
  test-generated-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Prepare generated workspace directory
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          if [[ ! "$PROJECT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Project name may contain only letters, numbers, dots, underscores, and hyphens." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/generated-workspace"
          echo "GENERATED_DIR=$RUNNER_TEMP/generated-workspace/$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Install Expect
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect

      - name: Generate workspace through the CLI
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          GITHUB_TOKEN: ${{ github.token }}
          LC_ALL: C.UTF-8
          CREATE_WORKSPACE_TEMPLATE_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/template
        run: |
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          cd "$RUNNER_TEMP/generated-workspace"
          expect <<'EOF'
          set stty_init "rows 24 columns 120"
          set timeout 30
          proc wait_for_prompt {prompt} {
            global spawn_id timeout
            expect {
              -exact $prompt { return }
              timeout { puts stderr "Timed out waiting for prompt: $prompt"; exit 1 }
              eof { puts stderr "Unexpected EOF waiting for prompt: $prompt"; exit 1 }
            }
          }
          spawn node $env(GITHUB_WORKSPACE)/dist/cli.mjs
          wait_for_prompt "テンプレートを選択してください"
          send "\033\133B\r"
          wait_for_prompt "プロジェクト名を入力してください"
          send "$env(PROJECT_NAME)\r"
          wait_for_prompt "このコマンドを実行してよろしいですか？"
          send "\033\133D\r"
          set timeout 1200
          expect {
            eof {}
            timeout { puts stderr "Timed out waiting for workspace generation to finish"; exit 1 }
          }
          set result [wait]
          if {[lindex $result 2] != 0 || [llength $result] > 4} {
            puts stderr "CLI did not exit normally: $result"
            exit 1
          }
          exit [lindex $result 3]
          EOF
          for file in package.json pnpm-workspace.yaml pnpm-lock.yaml biome.json; do
            if [[ ! -f "$GENERATED_DIR/$file" ]]; then
              echo "Generated workspace is missing $file: $GENERATED_DIR" >&2
              exit 1
            fi
          done

      - name: Install generated workspace dependencies
        run: pnpm --dir "$GENERATED_DIR" install --frozen-lockfile

      - name: Check generated workspace formatting and lint
        run: pnpm --dir "$GENERATED_DIR" check

      - name: Typecheck generated workspace
        run: pnpm --dir "$GENERATED_DIR" typecheck

      - name: Build generated workspace
        run: pnpm --dir "$GENERATED_DIR" build
